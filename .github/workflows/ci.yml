name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # A deployment workflow can call this workflow and depend on its result.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: safetext
          POSTGRES_PASSWORD: safetext_ci_only
          POSTGRES_DB: safetext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safetext -d safetext_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CI: true
      TEST_DATABASE_URL: postgres://safetext:safetext_ci_only@localhost:5432/safetext_test

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      # Install directly so CI never needs developer .env files or setup locks.
      - name: Install backend dependencies
        run: npm --prefix server ci

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Type-check backend
        run: npm --prefix server run typecheck

      - name: Build backend and frontend
        run: npm run build

      - name: Run database integration tests
        run: npm test

      - name: Smoke-test compiled backend
        shell: bash
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          PORT: 3001
          NODE_ENV: production
        run: |
          node server/dist/index.js > "$RUNNER_TEMP/safetext-api.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          if ! curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://localhost:3001/api/v1/health; then
            cat "$RUNNER_TEMP/safetext-api.log"
            exit 1
          fi

      - name: Upload frontend build
        if: matrix.node == 24
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-build
          path: web/dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload backend build
        if: matrix.node == 24
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-build
          path: |
            server/dist/
            server/package.json
            server/package-lock.json
          if-no-files-found: error
          retention-days: 14
